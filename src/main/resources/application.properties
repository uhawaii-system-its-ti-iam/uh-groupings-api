# =========================================================================
# Spring-related.
server.servlet.contextPath=/uhgroupingsapi
server.port=8081
spring.jmx.enabled=false
spring.mvc.async.request-timeout=60000
spring.main.allow-circular-references=true
# Prevent default Spring Security authentication
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# =========================================================================
# Java version
java.specification.version.api=21

# =========================================================================
# Grouper related.
app.groupings.controller.uuid=1d7365a23c994f5f83f7b541d4a5fa5e
grouping.api.server.type=GROUPER

# Groupings related.
groupings.api.localhost.user=test_user
groupings.api.test.admin_user=test_admin
grouperClient.webService.login=test_app
groupings.max.owner.limit=100

# Bulk Grouper requests (see BatchExecutor). The most UH identifiers in one lookup request, and in one add or remove
# request: Grouper takes about 3 ms to look up an identifier, but about 115 ms to add or remove a member.
groupings.api.grouper.lookup-batch-size=1000
groupings.api.grouper.update-batch-size=250
# The most bulk lookup and remove requests this API instance sends at once. Adds to a group are always sent one at a
# time: Grouper fails most of the members of concurrent adds to the same group.
groupings.api.grouper.max-concurrent-requests=4
# How long to wait before each time a bulk request is sent again after failing in a way that can pass: without an
# answer from Grouper, or with only internal errors (EXCEPTION) for its members.
groupings.api.grouper.retry-delays-millis=5000,15000
# The subject source of UH people. Grouper looks an identifier up about five times faster in its source alone than
# in every source; identifiers not found there are looked up in every source.
groupings.api.grouper.person-source-id=UH core LDAP

# The @Async jobs (imports, resets, member attributes; see AsyncConfig). An import holds its thread for its whole
# length (about 25 minutes for 10,000 members), so a job queued behind them waits that long. When all the threads
# are busy and the queue is full, a new job is rejected.
groupings.api.async.threads=10
groupings.api.async.queue-capacity=100
# How long a finished job stays readable after it finishes, so a poll sent again after its answer was lost (the UI
# keeps sending a failed poll again for about 3 minutes) gets the same result or failure. Then it is forgotten, polled
# or not; the eviction runs at the interval below.
groupings.api.async.finished-job-retention-millis=600000
groupings.api.async.job-eviction-interval-millis=60000

# Groupings API.
groupings.api.settings=uh-settings
groupings.api.grouping_admins=${groupings.api.settings}:groupingAdmins
groupings.api.grouping_owners=${groupings.api.settings}:groupingOwners
groupings.api.attributes=${groupings.api.settings}:attributes
groupings.api.for_applications=${groupings.api.attributes}:for-applications
groupings.api.for_groups=${groupings.api.attributes}:for-groups
groupings.api.uhgrouping=${groupings.api.for_groups}:uh-grouping
groupings.api.uhgroupings=${groupings.api.for_applications}:uhgroupings
groupings.api.announcements=${groupings.api.uhgroupings}:announcements
groupings.api.propertystring=${groupings.api.uhgroupings}:propertyString
groupings.api.destinations=${groupings.api.uhgrouping}:destinations
groupings.api.listserv=${groupings.api.destinations}:listserv
groupings.api.releasedgrouping=${groupings.api.destinations}:uhReleasedGrouping
groupings.api.trio=${groupings.api.uhgrouping}:is-trio
groupings.api.curated=${groupings.api.uhgrouping}:curated
groupings.api.opt_in=${groupings.api.uhgrouping}:anyone-can:opt-in
groupings.api.opt_out=${groupings.api.uhgrouping}:anyone-can:opt-out
groupings.api.basis=:basis
groupings.api.exclude=:exclude
groupings.api.include=:include
groupings.api.owners=:owners
groupings.api.assign_type_group=group
groupings.api.operation_assign_attribute=assign_attr
groupings.api.operation_remove_attribute=remove_attr
groupings.api.every_entity=GrouperAll
groupings.api.stale_subject_id=g:gsa
groupings.api.stem=
groupings.api.success=SUCCESS
groupings.api.failure=FAILURE
groupings.api.current_user=current_user

# Input Validation Patterns & Limits
groupings.api.validation.path.regex=[\\w-:.]+
groupings.api.validation.path.maxlength=255
groupings.api.validation.uh-identifier.regex=^(_[a-zA-Z0-9]+|[a-zA-Z0-9]+)$
groupings.api.validation.uh-identifier.maxlength=64
groupings.api.validation.description.regex=^[a-zA-Z0-9\\s.,!?'\"-():/]*$
groupings.api.validation.description.maxlength=1000

# Location of sync destinations.
grouper.api.sync.destinations.location=uh-settings:attributes:for-groups:uh-grouping:destinations

