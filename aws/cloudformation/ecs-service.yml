AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Fargate Cluster and Service for UH Groupings API'

Parameters:
  Owner:
    Type: String
    Description: Owner identifier (e.g., mhodges, its-iam)
    Default: mhodges
  
  Project:
    Type: String
    Description: Project name
    Default: groupings
  
  Environment:
    Type: String
    Default: sandbx
    AllowedValues:
      - sandbx
      - dev
      - test
      - prod
    Description: Environment name

  Tier:
    Type: String
    Default: test
    AllowedValues:
      - test
      - prod
    Description: >-
      Deployment tier — the single source of truth for application config
      (APP_TIER in aws/.env). Selects the Spring profile (aws-<Tier>) and,
      together with Hostname/CertificateArn, the public identity of the service.
      Decoupled from Environment, which only names resources. AllowedValues
      turns a typo into a deploy-time error instead of a mis-tiered deploy.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the ECS cluster will be deployed
  
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: List of subnet IDs for the ECS service
  
  DesiredCount:
    Type: Number
    Default: 2
    Description: Desired number of tasks
  
  ContainerImage:
    Type: String
    Description: Container image URI from ECR

  GrouperPasswordSecretArn:
    Type: String
    Description: >-
      ARN of the groupings/api/grouper-password secret in Secrets Manager.
      Passed by setup.sh; injected into the container as
      GROUPERCLIENT_WEBSERVICE_PASSWORD.

  JwtSecretArn:
    Type: String
    Description: >-
      ARN of the groupings/api/jwt-secret secret in Secrets Manager.
      Passed by setup.sh; injected into the container as JWT_SECRET_KEY.

  CertificateArn:
    Type: String
    Default: ''
    Description: >-
      ARN of an ACM certificate to terminate TLS at the ALB. May be an
      ACM-managed (domain-validated) cert or a self-signed cert imported via
      `aws acm import-certificate`. When empty (the default), the stack is
      HTTP-only on port 80 — the current sandbox behavior. When provided, an
      HTTPS listener is added on 443 and port 80 redirects to 443.

  Hostname:
    Type: String
    Default: ''
    Description: >-
      Public FQDN clients use to reach the API (e.g.,
      groupings-api-test.its.hawaii.edu). Convention: non-prod hostnames must
      contain "test"; prod must not (enforced by setup.sh). When set, it is
      used in the LoadBalancerUrl output instead of the raw ALB DNS name. Leave
      empty in the sandbox until DNS/cert are provisioned.

Conditions:
  # Spring profile is taken directly from Tier (aws-<Tier>), so no
  # prod-vs-test inference condition is needed here — the tier is explicit.

  # When a certificate ARN is supplied, enable TLS at the ALB (HTTPS listener
  # + HTTP→HTTPS redirect). Empty string keeps the HTTP-only sandbox posture.
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]

  # When a public hostname is supplied, the LoadBalancerUrl output uses it
  # instead of the raw ALB DNS name.
  HasHostname: !Not [!Equals [!Ref Hostname, '']]

Resources:
  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${Owner}-${Project}-${Environment}-cluster'
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 1
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-cluster'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${Owner}-${Project}-${Environment}'
      RetentionInDays: 30

  # Security Group for ECS Tasks
  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for UH Groupings API ECS tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-sg-ecs'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # Application Load Balancer Security Group
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Application Load Balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-sg-alb'

  # Application Load Balancer
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${Owner}-${Project}-${Environment}-alb'
      Scheme: internet-facing
      Type: application
      Subnets: !Ref SubnetIds
      SecurityGroups:
        - !Ref ALBSecurityGroup
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-alb'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # Target Group
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${Owner}-${Project}-${Environment}-tg'
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref VpcId
      HealthCheckEnabled: true
      HealthCheckPath: /uhgroupingsapi/actuator/health
      HealthCheckProtocol: HTTP
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: 200

  # ALB Listener (port 80)
  # - No certificate: forward HTTP straight to the target group (sandbox default).
  # - Certificate present: redirect all HTTP to HTTPS so every client connection
  #   is TLS.
  ALBListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP

  # HTTPS Listener (port 443) — only created when a certificate ARN is provided.
  # Terminates TLS at the ALB and forwards plaintext HTTP to the task on 8080
  # inside the VPC. SslPolicy pins a modern TLS 1.2/1.3 policy.
  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Owner}-${Project}-${Environment}-role-ecs-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref GrouperPasswordSecretArn
                  - !Ref JwtSecretArn
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-role-ecs-execution'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Owner}-${Project}-${Environment}-role-ecs-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-role-ecs-task'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Owner}-${Project}-${Environment}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub '${Owner}-${Project}-${Environment}'
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
              Protocol: tcp
          Environment:
            # Spring profile is the deployment tier, taken directly from the
            # Tier parameter (APP_TIER in aws/.env) — the single source of
            # truth. Maps 1:1: aws-test | aws-prod. Decoupled from the AWS_ENV
            # name, so the shared sandbox (AWS_ENV=sandbx) runs the test tier.
            - Name: SPRING_PROFILES_ACTIVE
              Value: !Sub 'aws-${Tier}'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            # Bind the app to 8080 in every AWS environment, matching the
            # container port and target group.
            - Name: SERVER_PORT
              Value: '8080'
          # Secrets are stored in Secrets Manager by setup.sh, then injected
          # here as environment variables at container start. Spring relaxed
          # binding maps GROUPERCLIENT_WEBSERVICE_PASSWORD → the
          # grouperClient.webService.password property and JWT_SECRET_KEY →
          # jwt.secret.key (a required placeholder; the app won't start without it).
          Secrets:
            - Name: GROUPERCLIENT_WEBSERVICE_PASSWORD
              ValueFrom: !Ref GrouperPasswordSecretArn
            - Name: JWT_SECRET_KEY
              ValueFrom: !Ref JwtSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          HealthCheck:
            Command:
              - CMD-SHELL
              - curl -f http://localhost:8080/uhgroupingsapi/actuator/health || exit 1
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    DependsOn: ALBListener
    Properties:
      ServiceName: !Sub '${Owner}-${Project}-${Environment}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ECSSecurityGroup
      LoadBalancers:
        - ContainerName: !Sub '${Owner}-${Project}-${Environment}'
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-service'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ClusterName:
    Description: Name of the ECS cluster
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-ClusterName'
  
  ServiceName:
    Description: Name of the ECS service
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'
  
  LoadBalancerUrl:
    Description: URL of the Application Load Balancer
    # Scheme follows certificate presence (https when TLS is enabled); host
    # follows hostname presence (the public FQDN when set, else the raw ALB DNS).
    Value: !Sub
      - '${Scheme}://${Host}'
      - Scheme: !If [HasCertificate, 'https', 'http']
        Host: !If [HasHostname, !Ref Hostname, !GetAtt ApplicationLoadBalancer.DNSName]
    Export:
      Name: !Sub '${AWS::StackName}-LoadBalancerUrl'
