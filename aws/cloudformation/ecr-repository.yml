AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECR Repository for UH Groupings API'

Parameters:
  Owner:
    Type: String
    Description: Owner identifier (e.g., mhodges, its-iam)
    Default: mhodges
  
  Project:
    Type: String
    Description: >-
      Project identifier (<=13 chars). Must match AWS_PROJECT_ID in aws/.env.
    Default: groupings-api
  
  Environment:
    Type: String
    Default: sandbx
    AllowedValues:
      - sandbx
      - dev
      - test
      - prod
    Description: Environment name (follows organizational standards)

Resources:
  ECRRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${Owner}-${Project}-${Environment}'
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      # Required for the sandbox teardown/re-setup loop. CloudFormation refuses
      # to delete a repository that still contains images, so without this
      # `make aws-teardown` fails on the ecr stack once an image has been
      # pushed. EmptyOnDelete lets CloudFormation clear it first.
      EmptyOnDelete: true
      # Sandbox lifecycle: this project only ever pushes the `latest` tag (see
      # aws/setup.sh and aws/buildspec.yml), so tag-prefix rules for prod/dev/
      # test tags would never match anything. Keep it to what actually applies:
      # discard untagged layers quickly and cap total image count.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 1 day",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Keep at most 5 images total",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 5
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  RepositoryUri:
    Description: URI of the ECR repository
    Value: !GetAtt ECRRepository.RepositoryUri
    Export:
      Name: !Sub '${AWS::StackName}-RepositoryUri'
  
  RepositoryArn:
    Description: ARN of the ECR repository
    Value: !GetAtt ECRRepository.Arn
    Export:
      Name: !Sub '${AWS::StackName}-RepositoryArn'
