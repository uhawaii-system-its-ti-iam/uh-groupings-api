# =========================================================================
# AWS test-tier profile (SPRING_PROFILES_ACTIVE=aws-test, set by ecs-service.yml).
#
# Used by non-production AWS environments. Today that is the sandbox
# (AWS_ENV=sandbx), which maps to this profile; when a real test environment
# replaces the sandbox it will use this same profile unchanged.
#
# Non-secret Grouper connection details are set here directly so the container
# is fully configured without the developer overrides file (absent in AWS).
# The two secret values are injected as environment variables by the ECS task
# definition from Secrets Manager:
#   GROUPERCLIENT_WEBSERVICE_PASSWORD -> grouperClient.webService.password
#   JWT_SECRET_KEY                    -> jwt.secret.key
# The container also sets SERVER_PORT=8080, which overrides server.port below.
# =========================================================================
spring.config.activate.on-profile=aws-test

# Optional local import — harmless in AWS (file absent), convenient if a
# developer runs this profile locally.
spring.config.import=optional:file:${user.home}/.${user.name}-conf/uh-groupings-api-overrides.properties

server.port=8080

# Grouper test backend (non-secret; password comes from Secrets Manager).
grouperClient.webService.url=https://grouper-test.its.hawaii.edu/grouper-ws/servicesRest/
grouperClient.webService.login=_groupings_api_2

# =========================================================================
# Logging.
logging.level.edu.hawaii.its.groupings=INFO
logging.level.edu.hawaii.its.api=INFO

# =========================================================================
# Email Service — disabled in non-prod AWS so it never sends real mail.
app.environment=test
email.send.recipient=its-iam-web-app-dev-help-l@lists.hawaii.edu
email.is.enabled=false
