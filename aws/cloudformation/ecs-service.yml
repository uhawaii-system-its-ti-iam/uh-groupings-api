AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  ECS Fargate cluster and service for the UH Groupings API.

  The API is a PRIVATE service: it has no load balancer of its own. Access is
  controlled by the API task security group (sg-api-backend) and the companion
  UI reaches it over ECS Service Connect. This stack creates the cluster, the
  Service Connect namespace, the API service/task, sg-api-backend (exported for
  the UI stack to reference), IAM roles, and the log group.

  Test-env posture: SINGLE SUBNET, SINGLE AZ, DesiredCount 1, no NAT (AWS
  access via VPC endpoints). On-prem Grouper WS is a LIVE, REQUIRED dependency, but the
  data-center connectivity MECHANISM is still pending infrastructure-team
  confirmation. The container health check is intentionally omitted until that
  path is verified end to end, so the task is not restart-looped.
  See aws/AGENTS.md and aws/docs/aws-architecture.mmd.

Parameters:
  Owner:
    Type: String
    Description: Owner identifier (e.g., mhodges, its-iam)
    Default: mhodges

  Project:
    Type: String
    Description: >-
      Project identifier (<=13 chars). Must match AWS_PROJECT_ID in aws/.env.
    Default: groupings-api

  Environment:
    Type: String
    Default: sandbx
    AllowedValues:
      - sandbx
      - dev
      - test
      - prod
    Description: Environment name

  Tier:
    Type: String
    Default: test
    AllowedValues:
      - test
      - prod
    Description: >-
      Deployment tier — the single source of truth for application config
      (APP_TIER in aws/.env). Selects the Spring profile (aws-<Tier>), which in
      turn selects the Grouper backend (grouper-test vs grouper). Decoupled from
      Environment, which only names resources. No hostname or certificate is
      derived from it: the API has no public endpoint of its own.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where the ECS cluster is deployed

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >-
      Subnet ID(s) for the ECS service, from the vpc stack's SubnetId output.
      The vpc stack creates exactly ONE subnet, so this is a single-element
      list and the deployment is single-AZ. The parameter stays a List so
      multi-AZ can be enabled later without a template signature change.

  DesiredCount:
    Type: Number
    Default: 1
    Description: >-
      Desired number of API tasks. 1 today. Raising this without adding a
      second subnet would place every task in the same AZ — multi-AZ requires
      changing vpc.yml as well.

  ContainerImage:
    Type: String
    Description: Container image URI from ECR

  GrouperPasswordSecretArn:
    Type: String
    Description: >-
      ARN of the groupings/api/grouper-password secret in Secrets Manager.
      Passed by setup.sh; injected as GROUPERCLIENT_WEBSERVICE_PASSWORD.

  JwtSecretArn:
    Type: String
    Description: >-
      ARN of the groupings/api/jwt-secret secret in Secrets Manager.
      Passed by setup.sh; injected as JWT_SECRET_KEY.

Resources:
  # -------------------------------------------------------------------
  # ECS Service Connect namespace (Cloud Map HTTP namespace).
  # API-owned. The API service publishes itself here; the companion UI service
  # (deployed later, from the UI repo) joins the same namespace as a client to
  # reach the API by name over Service Connect — no load balancer required.
  # -------------------------------------------------------------------
  ServiceConnectNamespace:
    Type: AWS::ServiceDiscovery::HttpNamespace
    Properties:
      Name: !Sub '${Owner}-${Project}-${Environment}'
      Description: !Sub 'Service Connect namespace for ${Owner}-${Project}-${Environment}'

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${Owner}-${Project}-${Environment}-cluster'
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 1
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      ServiceConnectDefaults:
        Namespace: !GetAtt ServiceConnectNamespace.Arn
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-cluster'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${Owner}-${Project}-${Environment}'
      RetentionInDays: 30

  # -------------------------------------------------------------------
  # API task security group (sg-api-backend).
  # NO ingress is defined here on purpose: the API is deployed FIRST and the
  # UI's security group does not exist yet. The UI stack (deployed later) adds a
  # standalone AWS::EC2::SecurityGroupIngress that allows 8080 from sg-ui-apps,
  # referencing the exported id below. Until then the API has no inbound source
  # at all, and by project decision the API is NOT functionally exercised until
  # the UI is deployed — EnableExecuteCommand is intentionally left off and the
  # task role carries no ssmmessages:* permissions (see aws/AGENTS.md,
  # "Verification scope").
  #
  # Egress defaults to allow-all so the task can reach the VPC endpoints and,
  # once the data-center path is provisioned, on-prem Grouper WS.
  # -------------------------------------------------------------------
  ApiTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: >-
        UH Groupings API tasks (sg-api-backend). Ingress on 8080 is added later
        by the UI stack, scoped to sg-ui-apps only.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-sg-api-backend'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # IAM Roles
  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Owner}-${Project}-${Environment}-role-ecs-execution'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref GrouperPasswordSecretArn
                  - !Ref JwtSecretArn
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-role-ecs-execution'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Owner}-${Project}-${Environment}-role-ecs-task'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-role-ecs-task'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Owner}-${Project}-${Environment}'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: '512'
      Memory: '1024'
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      ContainerDefinitions:
        - Name: !Sub '${Owner}-${Project}-${Environment}'
          Image: !Ref ContainerImage
          Essential: true
          # Port mapping is NAMED so ECS Service Connect can publish it. The
          # ServiceConnectConfiguration below references PortName 'api-8080'.
          PortMappings:
            - Name: api-8080
              ContainerPort: 8080
              Protocol: tcp
              AppProtocol: http
          Environment:
            # Spring profile is the deployment tier (aws-test | aws-prod).
            - Name: SPRING_PROFILES_ACTIVE
              Value: !Sub 'aws-${Tier}'
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: SERVER_PORT
              Value: '8080'
          Secrets:
            - Name: GROUPERCLIENT_WEBSERVICE_PASSWORD
              ValueFrom: !Ref GrouperPasswordSecretArn
            - Name: JWT_SECRET_KEY
              ValueFrom: !Ref JwtSecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          # NOTE: No container HealthCheck on purpose. The app health endpoint
          # (/uhgroupingsapi/actuator/health) depends on reaching on-prem
          # Grouper WS. Grouper is a live, required dependency, but the
          # data-center connectivity mechanism is still PENDING INFRA
          # CONFIRMATION, so the endpoint cannot succeed yet and a health check
          # would make ECS restart-loop the task. Re-add it once the
          # data-center path is verified end to end.

  # ECS Service — no load balancer. Reachable via Service Connect + sg-api-backend.
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${Owner}-${Project}-${Environment}-service'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref ApiTaskSecurityGroup
      ServiceConnectConfiguration:
        Enabled: true
        Namespace: !GetAtt ServiceConnectNamespace.Arn
        Services:
          - PortName: api-8080
            DiscoveryName: groupings-api
            ClientAliases:
              - Port: 8080
                DnsName: groupings-api
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-service'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ClusterName:
    Description: Name of the ECS cluster
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${AWS::StackName}-ClusterName'

  ServiceName:
    Description: Name of the ECS service
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${AWS::StackName}-ServiceName'

  ApiTaskSecurityGroupId:
    Description: >-
      Security group id of the API tasks (sg-api-backend). The UI stack imports
      this and adds an ingress rule allowing 8080 from sg-ui-apps.
    Value: !Ref ApiTaskSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-ApiTaskSecurityGroupId'

  ServiceConnectNamespaceArn:
    Description: >-
      ARN of the Service Connect (Cloud Map HTTP) namespace. The UI service
      joins this namespace to reach the API.
    Value: !GetAtt ServiceConnectNamespace.Arn
    Export:
      Name: !Sub '${AWS::StackName}-ServiceConnectNamespaceArn'

  ServiceConnectDnsName:
    Description: Service Connect DNS name the UI uses to reach the API (port 8080)
    Value: groupings-api
    Export:
      Name: !Sub '${AWS::StackName}-ServiceConnectDnsName'
