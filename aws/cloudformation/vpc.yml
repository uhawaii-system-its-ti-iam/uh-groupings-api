AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Networking for the UH Groupings API. The VPC is assumed to already exist
  (provided by the VPC team, never created here). Provisions ONE private-posture
  subnet for the ECS Fargate API task, plus the AWS PrivateLink VPC endpoints
  that let it reach AWS services with no public IP and no NAT gateway.
  No load balancer and no public subnet: the API is a private service reached by
  the companion UI over ECS Service Connect. SINGLE SUBNET / SINGLE AZ by design
  (one task) — see the Subnet resource comment and aws/AGENTS.md before adding a
  second. Exports the subnet id for the ecs-service and UI stacks.

Parameters:
  Owner:
    Type: String
    Description: Owner identifier (e.g., mhodges, its-iam)
    Default: mhodges

  Project:
    Type: String
    Description: >-
      Project identifier (<=13 chars). Must match AWS_PROJECT_ID in aws/.env.
    Default: groupings-api

  Environment:
    Type: String
    Default: sandbx
    AllowedValues:
      - sandbx
      - dev
      - test
      - prod
    Description: Environment name (follows organizational standards)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the existing VPC the subnet is created in

  MainRouteTableId:
    Type: String
    Description: >-
      ID of the VPC's main route table (used by the S3 Gateway endpoint).
      Find it in the VPC console under Route Tables → filter by your VPC →
      the one marked "Yes" under Main.

  SubnetCidr:
    Type: String
    Default: 172.18.10.16/28
    Description: >-
      CIDR block for the API subnet. Must fall within the VPC's CIDR block and
      not overlap an existing subnet. Default sized for sandbox-vpc-01
      (172.18.0.128/25). Must match SUBNET_CIDR in aws/.env — validate with
      'make aws-check-vpc'. This subnet holds both the API task ENI and the
      interface VPC endpoint ENIs.

Resources:
  # -------------------------------------------------------------------
  # The single API subnet. Placed in the region's first Availability Zone.
  # Private by posture: no public IP on launch, and the ECS service sets
  # AssignPublicIp DISABLED. There is no route to an Internet Gateway or NAT.
  #
  # SINGLE SUBNET / SINGLE AZ IS DELIBERATE. The API runs one task
  # (DesiredCount 1), so a second subnet would sit empty and misrepresent the
  # deployment as multi-AZ. It is not. Keeping the task and all four interface
  # endpoint ENIs in one subnet also keeps every endpoint call inside one AZ,
  # avoiding cross-AZ data transfer charges.
  #
  # Do NOT add a second subnet speculatively. Enabling real multi-AZ is a
  # coordinated change:
  #   1. add a second AWS::EC2::Subnet in a different AZ (!Select [1, !GetAZs ''])
  #   2. change the SubnetId output to a comma-joined list of both ids
  #   3. add its CIDR to EndpointSecurityGroup ingress
  #   4. decide whether the interface endpoints need an ENI in both subnets
  #      (an extra hourly charge each) or should stay in one
  #   5. raise DesiredCount in the ecs stack
  # Raising DesiredCount alone does NOT buy availability — every task would
  # land in this one subnet and AZ.
  # -------------------------------------------------------------------
  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref SubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-subnet'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # -------------------------------------------------------------------
  # VPC Endpoints (AWS PrivateLink) — allow the Fargate task (no public IP,
  # no NAT gateway, no internet route) to reach AWS services over private
  # IPv4 addresses. This is what makes the "no NAT" posture viable.
  #
  # ECR image pull requires three endpoints:
  #   - ecr.api       (ECR API calls: GetAuthorizationToken, etc.)
  #   - ecr.dkr       (Docker registry: image layer downloads)
  #   - s3 (Gateway)  (image layers are stored in S3 behind the scenes)
  #
  # Secrets Manager requires:
  #   - secretsmanager (task definition secrets[] injection at startup)
  #
  # CloudWatch Logs requires:
  #   - logs           (awslogs driver sends container stdout/stderr)
  #
  # NOT required on Fargate: the ecs, ecs-agent, and ecs-telemetry endpoints.
  # On the Fargate launch type the control-plane/agent traffic does not
  # traverse the task ENI, so only the data-path services above need endpoints.
  # ECS Service Connect likewise needs no additional endpoint — the Envoy
  # sidecar is supplied and managed by the Fargate platform, not pulled
  # through this VPC.
  #
  # All interface endpoints live in the single subnet alongside the task, so
  # there is no cross-AZ endpoint traffic. The S3 gateway endpoint is a
  # route-table entry and costs nothing.
  # -------------------------------------------------------------------

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${Owner}-${Project}-${Environment} - VPC endpoint access from the API task'
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref SubnetCidr
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-sg-vpce'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.api'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref Subnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.ecr.dkr'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref Subnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref MainRouteTableId

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.secretsmanager'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref Subnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.logs'
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref Subnet
      SecurityGroupIds:
        - !Ref EndpointSecurityGroup

Outputs:
  # One subnet, one output. setup.sh reads this and passes it to the ecs stack's
  # SubnetIds parameter, which is a List<AWS::EC2::Subnet::Id> — a single id is a
  # valid one-element list. If a second subnet is ever added, change this Value
  # to !Join [',', [!Ref Subnet, !Ref SubnetB]] and nothing downstream needs to
  # change.
  SubnetId:
    Description: >-
      ID of the API subnet. Consumed by the ecs-service stack and available to
      the companion UI stack.
    Value: !Ref Subnet
    Export:
      Name: !Sub '${AWS::StackName}-SubnetId'

  SubnetAvailabilityZone:
    Description: >-
      Availability Zone of the API subnet. The deployment is single-AZ; this is
      that AZ.
    Value: !GetAtt Subnet.AvailabilityZone
    Export:
      Name: !Sub '${AWS::StackName}-SubnetAvailabilityZone'

  EndpointSecurityGroupId:
    Description: >-
      Security group id of the interface VPC endpoints (sg-vpce). API-owned;
      exported for visibility and troubleshooting.
    Value: !Ref EndpointSecurityGroup
    Export:
      Name: !Sub '${AWS::StackName}-EndpointSecurityGroupId'
