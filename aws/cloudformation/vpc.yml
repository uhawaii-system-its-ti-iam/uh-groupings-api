AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Networking for the UH Groupings API sandbox. The VPC is assumed to already
  exist (provided by the VPC team, never created here). Provisions two subnets
  in ONE Availability Zone: a private subnet for the ECS Fargate API task, and a
  small public subnet whose only occupant is a NAT Gateway. The NAT Gateway's
  Elastic IP is the fixed source address the UH Palo Alto firewall allow-lists so
  the API can reach Grouper WS over the public internet.
  No load balancer, no public endpoint, no inbound path: the API is a private
  service reached by the companion UI over ECS Service Connect.
  See aws/AGENTS.md and aws/docs/aws-architecture.mmd.

Parameters:
  Owner:
    Type: String
    Description: Owner identifier (e.g., mhodges, its-iam)
    Default: mhodges

  Project:
    Type: String
    Description: >-
      Project identifier (<=13 chars). Must match AWS_PROJECT_ID in aws/.env.
    Default: groupings-api

  Environment:
    Type: String
    Default: sandbx
    AllowedValues:
      - sandbx
      - dev
      - test
      - prod
    Description: Environment name (follows organizational standards)

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >-
      ID of the existing VPC. Its main route table MUST route 0.0.0.0/0 to an
      Internet Gateway — the public subnet inherits that route table, which is
      what gives the NAT Gateway its path out. Validate with
      'make aws-check-vpc'.

  PrivateSubnetCidr:
    Type: String
    Default: 172.18.10.16/28
    Description: >-
      CIDR for the private subnet that holds the API task. Must fall within the
      VPC CIDR and not overlap an existing subnet. Must match
      PRIVATE_SUBNET_CIDR in aws/.env.

  PublicSubnetCidr:
    Type: String
    Default: 172.18.10.32/28
    Description: >-
      CIDR for the public subnet that holds ONLY the NAT Gateway. Must fall
      within the VPC CIDR and not overlap the private subnet or an existing
      subnet. Must match PUBLIC_SUBNET_CIDR in aws/.env.

  NatEipAllocationId:
    Type: String
    Default: ''
    Description: >-
      Allocation ID (eipalloc-...) of a PRE-EXISTING Elastic IP to give the NAT
      Gateway. Leave blank on the very first deploy and CloudFormation will
      allocate one. STRONGLY RECOMMENDED: after the first deploy, record the
      allocation id in aws/.env as NAT_EIP_ALLOCATION_ID. A CloudFormation-owned
      EIP is RELEASED on teardown, so the next setup gets a different address and
      silently invalidates the UH firewall allow-list. Supplying the id here keeps
      the address stable across the teardown/re-setup loop.

Conditions:
  # Only create an EIP when the operator has not supplied a pre-existing one.
  CreateNatEip: !Equals [!Ref NatEipAllocationId, '']

Resources:
  # -------------------------------------------------------------------
  # Private subnet — holds the API task ENI. No public IP on launch, and the
  # ECS service sets AssignPublicIp DISABLED. Reaches the internet only
  # outbound, through the NAT Gateway.
  #
  # SINGLE AZ IS DELIBERATE. One task, so a second AZ would add cost and imply
  # HA that does not exist. Enabling multi-AZ is a coordinated change: add a
  # second private subnet in another AZ, add it to the PrivateSubnetIds output,
  # add a NAT Gateway per AZ (or accept cross-AZ NAT traffic), and raise
  # DesiredCount. Raising DesiredCount alone buys nothing.
  # -------------------------------------------------------------------
  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref PrivateSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-subnet-private'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # -------------------------------------------------------------------
  # Public subnet — the NAT Gateway is its ONLY occupant. No application
  # workload belongs here.
  #
  # Note there is deliberately no route table for this subnet: it inherits the
  # VPC's main route table, which must already route 0.0.0.0/0 to the Internet
  # Gateway. That keeps this stack from creating or owning an IGW, which belongs
  # to the VPC team. 'make aws-check-vpc' enforces the requirement.
  # -------------------------------------------------------------------
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VpcId
      CidrBlock: !Ref PublicSubnetCidr
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-subnet-public-nat'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # -------------------------------------------------------------------
  # Elastic IP for the NAT Gateway — the single fixed address the UH Palo Alto
  # firewall allow-lists for Grouper access.
  #
  # Created only when NatEipAllocationId is blank. Once created, record its
  # allocation id in aws/.env so subsequent deploys reuse it and teardown does
  # not release it. See the parameter description above.
  # -------------------------------------------------------------------
  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreateNatEip
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-eip-nat'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      SubnetId: !Ref PublicSubnet
      AllocationId: !If
        - CreateNatEip
        - !GetAtt NatEip.AllocationId
        - !Ref NatEipAllocationId
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-nat'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  # -------------------------------------------------------------------
  # Private route table — sends all non-local traffic to the NAT Gateway. This
  # is what gives the task outbound access to Grouper WS and to the AWS service
  # endpoints (ECR API, Secrets Manager, CloudWatch Logs).
  #
  # The private subnet MUST have its own route table rather than inheriting the
  # VPC's main table, because the main table routes 0.0.0.0/0 to the Internet
  # Gateway — useless to a task with no public IP.
  # -------------------------------------------------------------------
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub '${Owner}-${Project}-${Environment}-rtb-private'
        - Key: Owner
          Value: !Ref Owner
        - Key: Project
          Value: !Ref Project
        - Key: Environment
          Value: !Ref Environment
        - Key: ManagedBy
          Value: CloudFormation

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  # -------------------------------------------------------------------
  # S3 gateway endpoint — free, and it carries the bulk of the bytes, because
  # ECR image layers are stored in S3. Attached to the PRIVATE route table so
  # the task's S3-bound traffic uses the endpoint instead of the NAT Gateway
  # (which would incur per-GB data processing charges on every image pull).
  #
  # The four interface endpoints (ecr.api, ecr.dkr, secretsmanager, logs) were
  # REMOVED deliberately. Once a NAT Gateway exists for Grouper, they became a
  # redundant second path costing ~$29/month. Those API calls now egress through
  # the NAT; the traffic is small (auth tokens, secret fetches, log shipping).
  # Re-add them if the production branch removes internet egress.
  # -------------------------------------------------------------------
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

Outputs:
  # Consumed by setup.sh and passed to the ecs stack's SubnetIds parameter,
  # which is a List<AWS::EC2::Subnet::Id> — a single id is a valid one-element
  # list. If a second private subnet is ever added, change this to
  # !Join [',', [...]] and nothing downstream needs to change.
  PrivateSubnetId:
    Description: >-
      ID of the private subnet holding the API task. Consumed by the
      ecs-service stack and available to the companion UI stack.
    Value: !Ref PrivateSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PrivateSubnetId'

  PublicSubnetId:
    Description: ID of the public subnet holding only the NAT Gateway
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub '${AWS::StackName}-PublicSubnetId'

  NatGatewayId:
    Description: ID of the NAT Gateway providing outbound internet for the API task
    Value: !Ref NatGateway
    Export:
      Name: !Sub '${AWS::StackName}-NatGatewayId'

  NatEipAddress:
    Description: >-
      PUBLIC IP OF THE NAT GATEWAY. This is the address the UH Palo Alto
      firewall must allow-list for Grouper WS access. Give this value to the
      network team.
    Value: !If
      - CreateNatEip
      - !Ref NatEip
      - 'see NAT_EIP_ALLOCATION_ID in aws/.env (pre-existing EIP)'
    Export:
      Name: !Sub '${AWS::StackName}-NatEipAddress'

  NatEipAllocationIdOut:
    Description: >-
      Allocation ID of the NAT Gateway's Elastic IP. Record this in aws/.env as
      NAT_EIP_ALLOCATION_ID so the address survives 'make aws-teardown'.
    Value: !If
      - CreateNatEip
      - !GetAtt NatEip.AllocationId
      - !Ref NatEipAllocationId
    Export:
      Name: !Sub '${AWS::StackName}-NatEipAllocationId'

  PrivateRouteTableId:
    Description: >-
      ID of the private route table (0.0.0.0/0 to the NAT Gateway). Exported for
      troubleshooting and for the UI stack if it routes egress through this NAT.
    Value: !Ref PrivateRouteTable
    Export:
      Name: !Sub '${AWS::StackName}-PrivateRouteTableId'
