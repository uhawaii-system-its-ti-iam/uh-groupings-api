# =========================================================================
# AWS production-tier profile (SPRING_PROFILES_ACTIVE=aws-prod, set by
# ecs-service.yml when Environment=prod).
#
# CANDIDATE — review before the first production deploy. In particular,
# CONFIRM the production Grouper endpoint and service-account login below;
# they are best-guess values based on the test-tier naming and have not been
# verified against the production Grouper instance.
#
# As with aws-test, the two secret values are injected as environment
# variables from Secrets Manager (created by aws/setup.sh):
#   GROUPERCLIENT_WEBSERVICE_PASSWORD -> grouperClient.webService.password
#   JWT_SECRET_KEY                    -> jwt.secret.key
# The container also sets SERVER_PORT=8080, which overrides server.port below.
# =========================================================================
spring.config.activate.on-profile=aws-prod

# Optional local import — harmless in AWS (file absent).
spring.config.import=optional:file:${user.home}/.${user.name}-conf/uh-groupings-api-overrides.properties

server.port=8080

# Production Grouper backend (non-secret; password comes from Secrets Manager).
# TODO(confirm): verify the production Grouper URL and service-account login.
grouperClient.webService.url=https://grouper.its.hawaii.edu/grouper-ws/servicesRest/
grouperClient.webService.login=_groupings_api

# =========================================================================
# Logging.
logging.level.edu.hawaii.its.groupings=INFO
logging.level.edu.hawaii.its.api=INFO

# =========================================================================
# Email Service — enabled in production.
app.environment=prod
email.send.recipient=its-iam-web-app-dev-help-l@lists.hawaii.edu
email.is.enabled=true
